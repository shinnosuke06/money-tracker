<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>マネートラッカー</title>
  <meta name="description" content="個人用のお金の管理アプリ。データはこの端末のブラウザの中だけに保存されます。">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- 長い数字が電話番号のリンクにならないように -->
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <!-- ホーム画面に追加したときの設定(iPhone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="マネトラ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="view" class="view"></main>
  <nav id="tabbar" class="tabbar" aria-label="メインメニュー"></nav>
  <div id="toast-root" aria-live="polite"></div>
  <noscript><p class="noscript">このアプリを使うには JavaScript を有効にしてください。</p></noscript>

  <!-- 共通 -->
  <script src="js/core/util.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/libs.js"></script>
  <script src="js/core/charts.js"></script>
  <!-- 月末記録 -->
  <script src="js/features/monthly/model.js"></script>
  <script src="js/features/monthly/chart.js"></script>
  <script src="js/features/monthly/view.js"></script>
  <script src="js/features/monthly/manage.js"></script>
  <!-- 支払い管理 -->
  <script src="js/features/payments/model.js"></script>
  <script src="js/features/payments/legacy.js"></script>
  <script src="js/features/payments/forms.js"></script>
  <script src="js/features/payments/chart.js"></script>
  <script src="js/features/payments/views.js"></script>
  <!-- 設定・サンプル -->
  <script src="js/data/sample.js"></script>
  <script src="js/features/settings/view.js"></script>
  <!-- 準備中のタブ(各段階で置き換える) -->
  <script src="js/features/placeholder/view.js"></script>
  <!-- 起動 -->
  <script src="js/app.js"></script>
</body>
</html>
