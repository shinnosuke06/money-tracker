<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>マネートラッカー</title>
  <meta name="description" content="個人用のお金の管理アプリ。データはこの端末のブラウザの中だけに保存されます。">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- 長い数字が電話番号のリンクにならないように -->
  <meta name="format-detection" content="telephone=no">
  <!-- 色は js/core/theme-boot.js が表示テーマに合わせて書き換える -->
  <meta name="theme-color" content="#f4f4f1">
  <!-- ホーム画面に追加したときの設定(iPhone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="マネトラ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <!-- 表示テーマは、色が付く前(スタイルシートより前)に決める -->
  <script src="js/core/theme-boot.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="view" class="view"></main>
  <nav id="tabbar" class="tabbar" aria-label="メインメニュー"></nav>
  <div id="toast-root" aria-live="polite"></div>
  <noscript><p class="noscript">このアプリを使うには JavaScript を有効にしてください。</p></noscript>

  <!-- 共通 -->
  <script src="js/core/util.js"></script>
  <script src="js/core/theme.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/libs.js"></script>
  <script src="js/core/charts.js"></script>
  <script src="js/core/forms.js"></script>
  <script src="js/core/secrets.js"></script>
  <!-- 月末記録 -->
  <script src="js/features/monthly/model.js"></script>
  <script src="js/features/monthly/chart.js"></script>
  <script src="js/features/monthly/view.js"></script>
  <script src="js/features/monthly/manage.js"></script>
  <!-- 支払い管理 -->
  <script src="js/features/payments/model.js"></script>
  <script src="js/features/payments/legacy.js"></script>
  <script src="js/features/payments/forms.js"></script>
  <script src="js/features/payments/chart.js"></script>
  <script src="js/features/payments/views.js"></script>
  <!-- 資産管理 -->
  <script src="js/features/assets/model.js"></script>
  <script src="js/features/assets/prices.js"></script>
  <script src="js/features/assets/legacy.js"></script>
  <script src="js/features/assets/forms.js"></script>
  <script src="js/features/assets/charts.js"></script>
  <script src="js/features/assets/views.js"></script>
  <!-- ポケカ在庫 -->
  <script src="js/features/inventory/model.js"></script>
  <script src="js/features/inventory/legacy.js"></script>
  <script src="js/features/inventory/forms.js"></script>
  <script src="js/features/inventory/views.js"></script>
  <!-- 副業収入 -->
  <script src="js/features/sidejob/model.js"></script>
  <script src="js/features/sidejob/legacy.js"></script>
  <script src="js/features/sidejob/forms.js"></script>
  <script src="js/features/sidejob/views.js"></script>
  <!-- その他 -->
  <script src="js/features/more/view.js"></script>
  <!-- 設定・サンプル -->
  <script src="js/data/sample.js"></script>
  <script src="js/features/settings/view.js"></script>
  <!-- 準備中のタブ(各段階で置き換える) -->
  <script src="js/features/placeholder/view.js"></script>
  <!-- 起動 -->
  <script src="js/app.js"></script>
</body>
</html>
